<script>
const ROOTS=['C','C#','D','Eb','E','F','F#','G','G#','A','Bb','B'],KEYS=ROOTS.concat(ROOTS.map(x=>x+'m'));

const DS=['Ⅰ','♯Ⅰ','Ⅱ','♯Ⅱ','Ⅲ','Ⅳ','♯Ⅳ','Ⅴ','♯Ⅴ','Ⅵ','♯Ⅵ','Ⅶ'],DF=['Ⅰ','♭Ⅱ','Ⅱ','♭Ⅲ','Ⅲ','Ⅳ','♭Ⅴ','Ⅴ','♭Ⅵ','Ⅵ','♭Ⅶ','Ⅶ'],INT=['R','m2','M2','m3','M3','P4','A4/d5','P5','m6','M6','m7','M7'];

const $=id=>document.getElementById(id),track=()=>project.tracks[current],clone=x=>JSON.parse(JSON.stringify(x));
function newBar(){return {key:'C',accidental:'sharp',split:false,chord:'',octave:3,chord_1_2:'',octave_1_2:3,chord_3_4:'',octave_3_4:3,split_1_2:false,split_3_4:false,chord_1:'',octave_1:3,chord_2:'',octave_2:3,chord_3:'',octave_3:3,chord_4:'',octave_4:3,on_bass:'',on_bass_1_2:'',on_bass_3_4:'',on_bass_1:'',on_bass_2:'',on_bass_3:'',on_bass_4:'',resolution:'',bass:[],bass_grid:[],bass_grid_base:''}}
function newTrack(n){return {no:n,name:'JBR_'+String(n).padStart(2,'0')+'_',bpm:120,resolution:'16分音符',auto_low:'G2',auto_high:'F#3',bars:Array.from({length:16},newBar)}}
let project={format:'bass-midi-gui-multitrack',format_version:3,app:'Bass MIDI GUI iPhone',version:'12',project_name:'bass_project',tracks:[newTrack(1)]};
function parseNote(s){let m=(s||'').trim().match(/^([A-Ga-g])([#b♭]?)(-?\d+)?$/);if(!m)return null;let n=m[1].toUpperCase()+(m[2]==='♭'?'b':m[2]);return PC[n]===undefined?null:{name:n,pc:PC[n],oct:m[3]===undefined?null:+m[3]}}
function parseKey(k){k=(k||'').trim();let minor=k.endsWith('m'),root=minor?k.slice(0,-1):k,p=parseNote(root);return p?{pc:p.pc,minor}:null}
function spell(pc,mode){return(mode==='flat'?FLAT:SHARP)[((pc%12)+12)%12]}
function convertNote(s,mode){if((s||'').trim()==='-')return'-';let p=parseNote(s);if(!p)return s;return spell(p.pc,mode)+(p.oct===null?'':p.oct)}
function chordRoot(c){let m=(c||'').trim().match(/^([A-Ga-g])([#b♭]?)/);if(!m)return null;let n=m[1].toUpperCase()+(m[2]==='♭'?'b':m[2]);return PC[n]===undefined?null:{name:n,pc:PC[n],len:m[0].length}}
function normalizeChord(c,mode){c=(c||'').trim();let r=chordRoot(c);if(!r)return c;return spell(r.pc,mode)+c.slice(r.len)}
function midiNum(s){let p=parseNote(s);return p&&p.oct!==null?(p.oct+1)*12+p.pc:null}
function normalizeNote(s,mode,lo='G2',hi='F#3'){s=(s||'').trim();if(!s||s==='-')return s;let p=parseNote(s);if(!p)return s;if(p.oct!==null)return spell(p.pc,mode)+p.oct;let l=midiNum(lo)||43,h=midiNum(hi)||54;for(let n=l;n<=h;n++)if(n%12===p.pc)return spell(p.pc,mode)+(Math.floor(n/12)-1);return s}
function degree(n,k,mode){let a=parseNote(n),b=parseKey(k);if(!a||!b)return'';let d=(a.pc-b.pc+12)%12;return(mode==='flat'||b.minor?DF:DS)[d]}
function chordDegree(c,k,mode){let r=chordRoot(c);return r?degree(r.name,k,mode)+(c||'').trim().slice(r.len):''}
function cint(n,c){if((n||'').trim()==='-')return'-';let a=parseNote(n),r=chordRoot(c);return a&&r?INT[(a.pc-r.pc+12)%12]:''}
function subFor(res){return RES[res]||4}function basePath(slot,res){let s=subFor(res),beat=Math.floor(slot/s)+1,pos=slot%s+1;return s===1?[beat]:[beat,pos]}
function pathLabel(x){return(x.path||[]).join('.')}function frac(x){return 1/(x.divisions||[]).reduce((a,b)=>a*Math.max(2,+b||2),1)}
function noteValue(x,res){let lvl={1:0,2:1,4:2,8:3}[subFor(res)]||0;lvl+=(x.divisions||[]).length;let v={0:'♩',1:'♪',2:'16',3:'32',4:'64',5:'128'}[lvl]||String(2**(lvl+2));return(x.divisions||[]).includes(3)?v+'³':v}
function makeGrid(vals,res){let s=subFor(res),slots=s*4,a=Array.isArray(vals)?vals.slice():[];while(a.length<slots)a.push('');return Array.from({length:slots},(_,slot)=>({note:String(a[slot]||''),base_slot:slot,path:basePath(slot,res),divisions:[]}))}
function normalizeGrid(g,res){let slots=subFor(res)*4;if(!Array.isArray(g)||!g.length)return makeGrid([],res);if(g.every(x=>x&&Array.isArray(x.path)&&x.base_slot!==undefined)){let out=[],occ=new Set;g.forEach(x=>{let slot=Math.max(0,Math.min(slots-1,+x.base_slot||0));out.push({note:String(x.note||''),base_slot:slot,path:(x.path||basePath(slot,res)).map(Number),divisions:Array.isArray(x.divisions)?x.divisions.map(v=>Math.max(2,+v||2)):[]});occ.add(slot)});for(let slot=0;slot<slots;slot++)if(!occ.has(slot))out.push({note:'',base_slot:slot,path:basePath(slot,res),divisions:[]});out.sort((a,b)=>a.base_slot-b.base_slot||pathLabel(a).localeCompare(pathLabel(b),undefined,{numeric:true}));return out}if(g.every(x=>x&&x.slot!==undefined)){let vals=[];g.forEach(x=>{vals[+x.slot||0]=x.note||''});return makeGrid(vals,res)}return makeGrid(g.map(x=>x&&x.note||''),res)}
function remapGrid(g,oldRes,newRes){let os=subFor(oldRes),ns=subFor(newRes),slots=ns*4,out=[],occ=new Set;(g||[]).forEach(x=>{let oldSlot=+x.base_slot||0,newSlot=Math.max(0,Math.min(slots-1,Math.round(oldSlot/os*ns))),ob=basePath(oldSlot,oldRes),p=Array.isArray(x.path)?x.path:ob,suf=p.slice(0,ob.length).join('.')===ob.join('.')?p.slice(ob.length):[];out.push({note:String(x.note||''),base_slot:newSlot,path:basePath(newSlot,newRes).concat(suf),divisions:Array.isArray(x.divisions)?x.divisions.slice():[]});occ.add(newSlot)});for(let i=0;i<slots;i++)if(!occ.has(i))out.push({note:'',base_slot:i,path:basePath(i,newRes),divisions:[]});return normalizeGrid(out,newRes)}
function ensureBar(b){Object.assign(b,{key:b.key||'C',accidental:b.accidental||'sharp',split:!!b.split,octave:+b.octave||3,octave_1_2:+b.octave_1_2||3,octave_3_4:+b.octave_3_4||3,octave_1:+b.octave_1||3,octave_2:+b.octave_2||3,octave_3:+b.octave_3||3,octave_4:+b.octave_4||3});['chord','chord_1_2','chord_3_4','chord_1','chord_2','chord_3','chord_4','on_bass','on_bass_1_2','on_bass_3_4','on_bass_1','on_bass_2','on_bass_3','on_bass_4','resolution','bass_grid_base'].forEach(k=>{if(b[k]===undefined)b[k]=''});b.split_1_2=!!b.split_1_2;b.split_3_4=!!b.split_3_4;if(!Array.isArray(b.bass))b.bass=[];if(!Array.isArray(b.bass_grid))b.bass_grid=[];return b}
function effectiveRes(b,t){return RES[b.resolution]?b.resolution:t.resolution||'16分音符'}
function ensureGrid(b,t){let res=effectiveRes(b,t),old=b.bass_grid_base||res;if(!b.bass_grid.length)b.bass_grid=makeGrid(b.bass,res);else if(old!==res)b.bass_grid=remapGrid(b.bass_grid,old,res);else b.bass_grid=normalizeGrid(b.bass_grid,res);b.bass_grid_base=res;return res}
function splitCell(b,idx,parts){let x=b.bass_grid[idx];if(!x||x.divisions.length>=6)return;let kids=Array.from({length:parts},(_,i)=>({note:i===0?x.note:'',base_slot:x.base_slot,path:x.path.concat(i+1),divisions:x.divisions.concat(parts)}));b.bass_grid.splice(idx,1,...kids)}
function mergeCell(b,idx){let x=b.bass_grid[idx];if(!x||!x.divisions.length)return;let parts=x.divisions.at(-1),parent=x.path.slice(0,-1),div=x.divisions.slice(0,-1),ids=[];b.bass_grid.forEach((y,j)=>{if(y.base_slot===x.base_slot&&y.divisions.length===x.divisions.length&&y.path.slice(0,-1).join('.')===parent.join('.')&&y.divisions.join('.')===x.divisions.join('.'))ids.push(j)});if(ids.length!==parts)return;let note='';ids.forEach(j=>{if(!note&&b.bass_grid[j].note)note=b.bass_grid[j].note});b.bass_grid.splice(ids[0],ids.length,{note,base_slot:x.base_slot,path:parent,divisions:div})}
function chordForSlot(b,slot,res){let beat=Math.floor(slot/subFor(res))+1;if(!b.split)return b.chord;if(beat<=2)return b.split_1_2?(beat===1?b.chord_1:b.chord_2):b.chord_1_2;return b.split_3_4?(beat===3?b.chord_3:b.chord_4):b.chord_3_4}
function syncLegacyBass(b,res){let slots=subFor(res)*4;b.bass=[];for(let s=0;s<slots;s++){let x=b.bass_grid.find(y=>y.base_slot===s);b.bass.push(x?x.note:'')}}

function loadTop(){let t=track();$('bpm').value=t.bpm||120;$('res').value=t.resolution||'16分音符';$('trackName').value=t.name||('Track '+String(t.no).padStart(2,'0'));$('trackNo').innerHTML=project.tracks.map((x,i)=>`<option value="${i}" ${i===current?'selected':''}>${String(x.no).padStart(2,'0')}</option>`).join('')}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function chordUnitHTML(label,ch,oct,slash){return `<div class="chunit"><div class="chlabel">${label||'&nbsp;'}</div><div class="chline"><input class="chord" value="${esc(ch)}"><input class="oct" type="number" value="${oct||3}"><span>/</span><input class="slash" value="${esc(slash)}" placeholder="On"></div><div class="chdeg"></div></div>`}
function renderChords(box,b){let g=box.querySelector('.chordGrid');g.innerHTML='';let units=[];if(!b.split)units=[{col:0,span:4,label:'',ck:'chord',ok:'octave',sk:'on_bass'}];else{if(b.split_1_2)units.push({col:0,span:1,label:'1拍',ck:'chord_1',ok:'octave_1',sk:'on_bass_1'},{col:1,span:1,label:'2拍',ck:'chord_2',ok:'octave_2',sk:'on_bass_2'});else units.push({col:0,span:2,label:'1-2拍',ck:'chord_1_2',ok:'octave_1_2',sk:'on_bass_1_2'});if(b.split_3_4)units.push({col:2,span:1,label:'3拍',ck:'chord_3',ok:'octave_3',sk:'on_bass_3'},{col:3,span:1,label:'4拍',ck:'chord_4',ok:'octave_4',sk:'on_bass_4'});else units.push({col:2,span:2,label:'3-4拍',ck:'chord_3_4',ok:'octave_3_4',sk:'on_bass_3_4'})}units.forEach(u=>{let w=document.createElement('div');w.style.gridColumn=`${u.col+1} / span ${u.span}`;w.innerHTML=chordUnitHTML(u.label,b[u.ck],b[u.ok],b[u.sk]);let ch=w.querySelector('.chord'),oct=w.querySelector('.oct'),sl=w.querySelector('.slash'),dg=w.querySelector('.chdeg');function ref(){b[u.ck]=ch.value;dg.textContent=chordDegree(b[u.ck],b.key,b.accidental);refreshBassDegrees(box,b)}ch.oninput=ref;ch.onblur=()=>{b[u.ck]=normalizeChord(ch.value,b.accidental);ch.value=b[u.ck];ref()};oct.onchange=()=>b[u.ok]=+oct.value||3;sl.onblur=()=>{b[u.sk]=normalizeNote(sl.value,b.accidental,'C0','B8');sl.value=b[u.sk]};dg.textContent=chordDegree(b[u.ck],b.key,b.accidental);g.appendChild(w)})}
function selectBass(path,input,b,item){selectedRef={input,b,item};$('mirrorPath').textContent='選択Bass '+path;$('mirrorInput').value=input.value}
$('mirrorInput').oninput=()=>{if(!selectedRef)return;selectedRef.input.value=$('mirrorInput').value;selectedRef.item.note=$('mirrorInput').value};$('mirrorInput').onblur=()=>{if(!selectedRef)return;let t=track(),b=selectedRef.b;selectedRef.item.note=normalizeNote($('mirrorInput').value,b.accidental,t.auto_low||'G2',t.auto_high||'F#3');selectedRef.input.value=selectedRef.item.note;$('mirrorInput').value=selectedRef.item.note;refreshBassDegrees(selectedRef.input.closest('.bar'),b)};
function refreshBassDegrees(box,b){if(!box)return;let t=track(),res=effectiveRes(b,t);box.querySelectorAll('.note').forEach(cell=>{let idx=+cell.dataset.idx,x=b.bass_grid[idx],n=x?x.note:'',slot=x?x.base_slot:0;cell.querySelector('.keydeg').textContent=degree(n,b.key,b.accidental);cell.querySelector('.rootdeg').textContent=cint(n,chordForSlot(b,slot,res))})}

function render(){syncTop();let t=track(),start=page*PAGE,end=Math.min(start+PAGE,t.bars.length);$('pageInfo').textContent=`${start+1}–${Math.min(start+PAGE,t.bars.length)} 小節`;$('bars').innerHTML='';for(let bi=start;bi<end;bi++){let b=ensureBar(t.bars[bi]);ensureGrid(b,t);let box=document.createElement('section');box.className='bar';box.innerHTML=`<div class="barhead"><b>${bi+1}小節</b><button class="copy smallbtn">C</button><button class="paste smallbtn">P</button><label>Key <select class="key">${KEYS.map(x=>`<option ${x===b.key?'selected':''}>${x}</option>`).join('')}</select></label><button class="spell smallbtn">#/♭</button><label>分解能 <select class="barres"><option value="">Track</option>${Object.keys(RES).map(x=>`<option>${x}</option>`).join('')}</select></label></div><div class="chordControls"><label><input class="split" type="checkbox" ${b.split?'checked':''}>2拍分割</label><label class="sub12"><input type="checkbox" ${b.split_1_2?'checked':''}>1-2拍を1拍分割</label><label class="sub34"><input type="checkbox" ${b.split_3_4?'checked':''}>3-4拍を1拍分割</label></div><div class="chordGrid"></div><div class="bassWrap"><div class="bassGrid"></div></div>`;$('bars').appendChild(box);let key=box.querySelector('.key'),barres=box.querySelector('.barres'),sp=box.querySelector('.split'),s12=box.querySelector('.sub12 input'),s34=box.querySelector('.sub34 input');barres.value=b.resolution||'';function toggleSplitUI(){box.querySelector('.sub12').style.display=b.split?'inline-flex':'none';box.querySelector('.sub34').style.display=b.split?'inline-flex':'none'}toggleSplitUI();renderChords(box,b);renderBass(box,b);box.querySelector('.copy').onclick=()=>barClipboard=clone(b);box.querySelector('.paste').onclick=()=>{if(barClipboard){t.bars[bi]=clone(barClipboard);renderPreserveScroll()}};key.onchange=()=>{b.key=key.value;renderChords(box,b);refreshBassDegrees(box,b)};box.querySelector('.spell').onclick=()=>{commitInputs(box,b);b.accidental=b.accidental==='sharp'?'flat':'sharp';['chord','chord_ function inputBars(t){for(let i=t.bars.length-1;i>=0;i--){let b=ensureBar(t.bars[i]||{}),hasChord=['chord','chord_1_2','chord_3_4','chord_1','chord_2','chord_3','chord_4'].some(k=>(b[k]||'').trim()),hasBass=(b.bass_grid||[]).some(x=>(x.note||'').trim()&&x.note!=='-')||(b.bass||[]).some(x=>x&&x!=='-');if(hasChord||hasBass)return i+1}return 0}
const CONFIG_PAGE=8;let configPage=0,lastDeleted=null;function renderConfig(){let total=Math.max(1,Math.ceil(project.tracks.length/CONFIG_PAGE));configPage=Math.max(0,Math.min(configPage,total-1));let start=configPage*CONFIG_PAGE,end=Math.min(start+CONFIG_PAGE,project.tracks.length);$('configPageInfo').textContent=`${configPage+1} / ${total}`;$('configPrevBtn').disabled=configPage===0;$('configNextBtn').disabled=configPage>=total-1;$('configUndoBtn').disabled=!lastDeleted;$('trackList').innerHTML='';for(let x=start;x<end;x++){let t=project.tracks[x],d=document.createElement('div');d.className='trackcard';d.innerHTML=`<b>Ex ${String(x+1).padStart(2,'0')}</b><input value="${esc(t.name||'')}"><span class="count">${inputBars(t)}小節</span><button class="del">削除</button>`;let i=d.querySelector('input');i.oninput=()=>t.name=i.value;i.onblur=()=>{if(!i.value.trim())i.value=t.name='JBR_'+String(t.no||x+1).padStart(2,'0')+'_'};d.querySelector('.del').onclick=()=>deleteConfigTrack(x);$('trackList').appendChild(d)}}function showConfig(){syncTop();configPage=Math.floor(current/CONFIG_PAGE);$('editHeader').classList.add('hidden');$('bars').classList.add('hidden');$('config').classList.remove('hidden');renderConfig()}function hideConfig(){$('config').classList.add('hidden');$('editHeader').classList.remove('hidden');$('bars').classList.remove('hidden');current=Math.max(0,Math.min(current,project.tracks.length-1));loadTop();render()}function configMove(d){configPage+=d;renderConfig()}function addConfigTrack(){let n=Math.max(0,...project.tracks.map(x=>+x.no||0))+1;project.tracks.push(newTrack(n));current=project.tracks.length-1;configPage=Math.floor(current/CONFIG_PAGE);renderConfig()}function deleteConfigTrack(idx){if(project.tracks.length<=1)return alert('最後の1トラックは削除できません');let t=project.tracks[idx];if(!confirm(`Ex ${String(idx+1).padStart(2,'0')}「${t.name||''}」を削除しますか？`))return;lastDeleted={index:idx,track:project.tracks.splice(idx,1)[0]};if(current>=project.tracks.length)current=project.tracks.length-1;renderConfig()}function undoConfigDelete(){if(!lastDeleted)return;project.tracks.splice(Math.min(lastDeleted.index,project.tracks.length),0,lastDeleted.track);current=Math.min(lastDeleted.index,project.tracks.length-1);configPage=Math.floor(current/CONFIG_PAGE);lastDeleted=null;renderConfig()}
function tempSave(){syncTop();localStorage.setItem(TEMP,JSON.stringify(project));alert('一時保存しました')}function tempLoad(){let s=localStorage.getItem(TEMP);if(!s)return alert('一時保存データがありません');project=JSON.parse(s);upgrade();current=page=0;loadTop();render()}function safe(s){return(s||'bass_project').replace(/[\\/:*?"<>|]/g,'_')}async function share(file,title){if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title});return true}return false}
async function saveProject(){syncTop();let n=prompt('ファイル名',safe(project.project_name));if(n===null)return;n=safe(n.replace(/\.json$/i,''));project.project_name=n;let f=new File([JSON.stringify(project,null,2)],n+'.json',{type:'application/json'});try{if(await share(f,n))return}catch(e){if(e.name==='AbortError')return}let a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=n+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function upgrade(){if(project.format!=='bass-midi-gui-multitrack'&&Array.isArray(project.bars))project={format:'bass-midi-gui-multitrack',format_version:3,version:'12',project_name:'bass_project',tracks:[{no:1,name:'Track 01',bpm:project.bpm||120,resolution:project.resolution||'16分音符',auto_low:project.auto_low||'G2',auto_high:project.auto_high||'F#3',bars:project.bars}]};project.tracks=(project.tracks||[]);if(!project.tracks.length)project.tracks=[newTrack(1)];project.tracks.forEach((t,i)=>{t.no=t.no||i+1;t.name=t.name||('JBR_'+String(t.no).padStart(2,'0')+'_');t.bpm=t.bpm||120;t.resolution=RES[t.resolution]?t.resolution:'16分音符';t.auto_low=t.auto_low||'G2';t.auto_high=t.auto_high||'F#3';t.bars=t.bars||[];(t.bars||[]).forEach(b=>{ensureBar(b);let r=effectiveRes(b,t);if(!b.bass_grid.length)b.bass_grid=makeGrid(b.bass,r);else b.bass_grid=normalizeGrid(b.bass_grid,b.bass_grid_base||r);b.bass_grid_base=b.bass_grid_base||r})});project.format='bass-midi-gui-multitrack';project.format_version=3;project.version='12';project.app='Bass MIDI GUI iPhone'}
$('pick').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{project=JSON.parse(await f.text());upgrade();current=page=0;loadTop();render()}catch(err){alert('読込エラー: '+err.message)}e.target.value=''};
function chordNotes(c,oct){let r=chordRoot(c);if(!r)return[];let suf=(c||'').trim().slice(r.len),ints={'':[0,4,7],'m':[0,3,7],'7':[0,4,7,10],'maj7':[0,4,7,11],'m7':[0,3,7,10],'m7b5':[0,3,6,10],'dim':[0,3,6],'dim7':[0,3,6,9],'aug':[0,4,8],'sus4':[0,5,7],'7sus4':[0,5,7,10]}[suf];if(!ints)return[];let root=(+oct+1)*12+r.pc;return ints.map(x=>root+x)}function chordNotesSlash(c,oct,on){let a=chordNotes(c,oct);if(!a.length||!on)return a;let p=parseNote(on);if(!p)return a;let n=p.oct===null?a[0]-((a[0]-p.pc)%12+12)%12:(p.oct+1)*12+p.pc;if(!a.includes(n))a.unshift(n);return a}
function vlq(n){let a=[n&127];while(n>>=7)a.unshift((n&127)|128);return a}function u32(n){return[n>>>24&255,n>>>16&255,n>>>8&255,n&255]}function ascii(s){return[...s].map(c=>c.charCodeAt(0))}
function makeMidi(t){let last=inputBars(t)-1;if(last<0)throw Error('入力されたデータがありません');let ev=[],tempo=Math.round(6e7/(t.bpm||120));ev.push({x:0,d:[255,81,3,tempo>>16&255,tempo>>8&255,tempo&255]},{x:0,d:[192,0]},{x:0,d:[193,33]});for(let bi=0;bi<=last;bi++){let b=ensureBar(t.bars[bi]),res=ensureGrid(b,t),base=bi*4*Q;let addChord=(c,o,beats,on,startBeat)=>{let ns=chordNotesSlash(c,o,on);if(!ns.length)return;let st=base+startBeat*Q,du=beats*Q*.92;ns.forEach(n=>{ev.push({x:st,d:[144,n,62]},{x:Math.round(st+du),d:[128,n,0]})})};if(!b.split)addChord(b.chord,b.octave,4,b.on_bass,0);else{if(b.split_1_2){addChord(b.chord_1,b.octave_1,1,b.on_bass_1,0);addChord(b.chord_2,b.octave_2,1,b.on_bass_2,1)}else addChord(b.chord_1_2,b.octave_1_2,2,b.on_bass_1_2,0);if(b.split_3_4){addChord(b.chord_3,b.octave_3,1,b.on_bass_3,2);addChord(b.chord_4,b.octave_4,1,b.on_bass_4,3)}else addChord(b.chord_3_4,b.octave_3_4,2,b.on_bass_3_4,2)}let s=subFor(res),cursor=base,i=0,g=normalizeGrid(b.bass_grid,res);for(let slot=0;slot<s*4;slot++){let items=g.filter(x=>x.base_slot===slot);for(let k=0;k<items.length;k++){let x=items[k],dur=Math.round(Q/s*frac(x)),raw=(x.note||'').trim();if(raw==='-'){cursor+=dur;continue}let n=midiNum(normalizeNote(raw,b.accidental,t.auto_low||'G2',t.auto_high||'F#3'));let total=dur,j=k+1;while(j<items.length&&(items[j].note||'').trim()==='-'){total+=Math.round(Q/s*frac(items[j]));j++}if(n!==null){ev.push({x:cursor,d:[145,n,92]},{x:cursor+Math.round(total*.92),d:[129,n,0]})}cursor+=total;k=j-1}}}ev.sort((a,b)=>a.x-b.x);let d=[],p=0;for(let e of ev){d.push(...vlq(Math.max(0,e.x-p)),...e.d);p=e.x}d.push(0,255,47,0);return new Uint8Array([...ascii('MThd'),...u32(6),0,0,0,1,1,224,...ascii('MTrk'),...u32(d.length),...d])}
async function midiOne(){syncTop();let t=track();try{let f=new File([makeMidi(t)],safe(project.project_name)+'_track'+String(t.no).padStart(2,'0')+'.mid',{type:'audio/midi'});if(!await share(f,f.name)){let a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()}}catch(e){if(e.name!=='AbortError')alert('MIDI出力エラー: '+e.message)}}async function midiAll(){syncTop();let ts=project.tracks.filter(t=>inputBars(t)>0);if(!ts.length)return alert('入力されたデータがありません');for(let t of ts){let f=new File([makeMidi(t)],safe(project.project_name)+'_track'+String(t.no).padStart(2,'0')+'.mid',{type:'audio/midi'});try{if(!await share(f,f.name)){let a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()}}catch(e){if(e.name==='AbortError')break}}}
$('trackNo').onchange=()=>{syncTop();current=+$('trackNo').value;page=0;loadTop();render()};$('bpm').onchange=syncTop;$('res').onchange=()=>{let t=track(),old=t.resolution||'16分音符';syncTop();let nr=t.resolution;t.bars.forEach(b=>{ensureBar(b);let br=RES[b.resolution]?b.resolution:null;if(!br){let oldr=b.bass_grid_base||old;b.bass_grid=remapGrid(b.bass_grid.length?b.bass_grid:makeGrid(b.bass,oldr),oldr,nr);b.bass_grid_base=nr;syncLegacyBass(b,nr)}});render()};$('trackName').onchange=syncTop;

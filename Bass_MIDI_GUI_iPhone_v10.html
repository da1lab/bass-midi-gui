<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Bass MIDI GUI iPhone v10</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;margin:0;background:#f5f5f7;color:#111}header{position:sticky;top:0;background:#fff;border-bottom:1px solid #bbb;padding:8px;z-index:10}h1{font-size:19px;margin:0 0 5px}.tools,.nav{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:5px}button,input,select{font-size:16px;min-height:38px;box-sizing:border-box}button{padding:4px 9px}main{padding:5px}.legend{font-size:15px;font-weight:700}.bar{background:#fff;border:1px solid #bbb;border-radius:9px;padding:8px;margin:8px 0;overflow-x:auto}.barhead{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:7px}.barhead b{font-size:18px}.chord{width:88px}.oct{width:50px}.bassrow{display:flex;gap:5px;min-width:max-content}.note{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:56px}.note input{width:54px;height:40px;text-align:center;font-size:18px;font-weight:600}.deg{font-size:18px;font-weight:800;line-height:1.05}.keydeg{color:#188038}.chdeg{color:#7b1fa2}.small{font-size:13px;color:#555}.hidden{display:none}.pageinfo{font-weight:700;min-width:105px;text-align:center}.trackcard{background:#fff;border:1px solid #bbb;border-radius:9px;padding:10px;margin:8px;display:grid;grid-template-columns:75px 1fr 105px;gap:8px;align-items:center}.trackcard input{width:100%}.count{font-weight:700}.trackbox{background:#eef2ff;border-radius:8px;padding:4px 6px}
.filegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.filegrid button{min-height:52px}.barres{font-size:14px;min-height:34px}</style></head><body>
<header id="editHeader"><h1>Bass MIDI GUI iPhone v10</h1>
<div class="tools trackbox"><label>Track <select id="trackNo"></select></label><button id="addTrackBtn">＋Track</button><label>名前 <input id="trackName" style="width:110px"></label><button id="configBtn">トラック構成</button><button id="fileMenuBtn">ファイル</button></div>
<div class="tools"><label>BPM <input id="bpm" type="number" value="120" min="40" max="240" style="width:64px"></label><label>分解能 <select id="res"><option>4分音符</option><option selected>8分音符</option><option>16分音符</option></select></label><button id="addBarsBtn">＋16小節</button></div>

<div class="nav"><button id="scrollUpBtn">↑</button><button id="scrollDownBtn">↓</button><button id="prevBtn">←</button><span id="pageInfo" class="pageinfo"></span><button id="nextBtn">→</button></div>
<div class="legend"><span style="color:#188038">● Keyから見た度数</span>　<span style="color:#7b1fa2">● コードルートから見た度数</span></div>
</header>
<main id="bars"></main>
<section id="fileMenu" class="hidden"><div class="tools" style="padding:8px"><button id="fileBackBtn">← 編集へ戻る</button><h2 style="margin:0">ファイル</h2></div><div class="filegrid"><button id="tempSaveBtn">一時保存</button><button id="tempLoadBtn">一時保存読込</button><button id="saveBtn">ファイル保存</button><button id="loadBtn">ファイル読込</button><button id="midiOneBtn">指定Track MIDI</button><button id="midiAllBtn">全Track MIDI</button></div></section><section id="config" class="hidden"><div class="tools" style="padding:8px"><button id="backBtn">← 編集へ戻る</button><h2 style="margin:0">トラック構成</h2></div><div id="trackList"></div></section>
<script>
const ROOTS=['C','C#','D','Eb','E','F','F#','G','G#','A','Bb','B'],PC={'C':0,'C#':1,'Db':1,'D':2,'D#':3,'Eb':3,'E':4,'F':5,'F#':6,'Gb':6,'G':7,'G#':8,'Ab':8,'A':9,'A#':10,'Bb':10,'B':11};
const SHARP=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],FLAT=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const DS=['Ⅰ','♯Ⅰ','Ⅱ','♯Ⅱ','Ⅲ','Ⅳ','♯Ⅳ','Ⅴ','♯Ⅴ','Ⅵ','♯Ⅵ','Ⅶ'],DF=['Ⅰ','♭Ⅱ','Ⅱ','♭Ⅲ','Ⅲ','Ⅳ','♭Ⅴ','Ⅴ','♭Ⅵ','Ⅵ','♭Ⅶ','Ⅶ'],INT=['R','m2','M2','m3','M3','P4','A4/d5','P5','m6','M6','m7','M7'];
const PAGE=16,TEMP='bass_gui_v9_3_temp';let page=0,current=0;
function newBar(){return {key:'C',accidental:'sharp',split:false,chord:'',octave:3,chord_1_2:'',octave_1_2:3,chord_3_4:'',octave_3_4:3,bass:[]}}
function newTrack(n){return {no:n,name:'Track '+String(n).padStart(2,'0'),bpm:120,resolution:'8分音符',auto_low:'G2',auto_high:'F#3',bars:Array.from({length:16},newBar)}}
let project={format:'bass-midi-gui-multitrack',format_version:3,app:'Bass MIDI GUI iPhone',version:'10',project_name:'bass_project',tracks:[newTrack(1)]};
const $=id=>document.getElementById(id),track=()=>project.tracks[current],sub=t=>({'4分音符':1,'8分音符':2,'16分音符':4}[t.resolution]||2);
function parseNote(s){let m=(s||'').trim().match(/^([A-Ga-g])([#b♭]?)(-?\d+)?$/);if(!m)return null;let n=m[1].toUpperCase()+(m[2]==='♭'?'b':m[2]);return PC[n]===undefined?null:{name:n,pc:PC[n],oct:m[3]===undefined?null:+m[3]}}
function spell(pc,mode){return (mode==='flat'?FLAT:SHARP)[((pc%12)+12)%12]}
function convertNote(s,mode){let p=parseNote(s);if(!p)return s;return spell(p.pc,mode)+(p.oct===null?'':p.oct)}
function chordRoot(c){let m=(c||'').trim().match(/^([A-Ga-g])([#b♭]?)/);if(!m)return null;let n=m[1].toUpperCase()+(m[2]==='♭'?'b':m[2]);return PC[n]===undefined?null:{name:n,pc:PC[n],len:m[0].length}}
function normalizeChord(c,mode){c=(c||'').trim();let r=chordRoot(c);if(!r)return c;return spell(r.pc,mode)+c.slice(r.len)}
function convertChord(c,mode){return normalizeChord(c,mode)}
function midiNum(s){let p=parseNote(s);return p&&p.oct!==null?(p.oct+1)*12+p.pc:null}
function normalizeNote(s,mode,lo='G2',hi='F#3'){s=(s||'').trim();if(!s||s==='-')return s;let p=parseNote(s);if(!p)return s;if(p.oct!==null)return spell(p.pc,mode)+p.oct;let l=midiNum(lo)||43,h=midiNum(hi)||54;for(let n=l;n<=h;n++)if(n%12===p.pc)return spell(p.pc,mode)+(Math.floor(n/12)-1);return s}
function degree(n,k,mode){let a=parseNote(n),b=parseNote(k);if(!a||!b)return'';let d=(a.pc-b.pc+12)%12;return mode==='flat'?DF[d]:DS[d]}
function cint(n,c){let a=parseNote(n),r=chordRoot(c);return a&&r?INT[(a.pc-r.pc+12)%12]:''}
function syncTop(){let t=track();t.bpm=+$('bpm').value||120;t.resolution=$('res').value;t.name=$('trackName').value.trim()||('Track '+String(t.no).padStart(2,'0'))}
function loadTop(){let t=track();$('bpm').value=t.bpm||120;$('res').value=t.resolution||'8分音符';$('trackName').value=t.name||('Track '+String(t.no).padStart(2,'0'));$('trackNo').innerHTML=project.tracks.map((x,i)=>`<option value="${i}" ${i===current?'selected':''}>${String(x.no).padStart(2,'0')}</option>`).join('')}
function ensureBar(b){if(!b.accidental)b.accidental=((b.chord||'').includes('b')||(b.bass||[]).some(x=>(x||'').includes('b')))?'flat':'sharp';if(!Array.isArray(b.bass))b.bass=[];return b}
function render(){syncTop();let t=track(),start=page*PAGE,end=Math.min(start+PAGE,t.bars.length);$('pageInfo').textContent=`${start+1}–${start+PAGE} 小節`;$('bars').innerHTML='';
for(let bi=start;bi<end;bi++){let b=ensureBar(t.bars[bi]),barSub={'4分音符':1,'8分音符':2,'16分音符':4}[b.resolution]||sub(t),count=4*barSub;while(b.bass.length<count)b.bass.push(''); /* Do not truncate: preserves v8 data when resolution changes. */
let box=document.createElement('section');box.className='bar';box.innerHTML=`<div class="barhead"><b>${bi+1}小節</b><button class="copy" tabindex="-1" ${bi===0?'disabled':''}>copy</button><label>Key <select class="key">${ROOTS.map(x=>`<option ${x===b.key?'selected':''}>${x}</option>`).join('')}</select></label><label>Chord <input class="chord" value="${b.chord||''}"></label><button class="spell" tabindex="-1">#/♭</button><label>Oct <input class="oct" type="number" value="${b.octave||3}"></label><label>分解能 <select class="barres"><option value="">Track</option><option>4分音符</option><option>8分音符</option><option>16分音符</option></select></label></div><div class="bassrow"></div>`;
let key=box.querySelector('.key'),ch=box.querySelector('.chord'),row=box.querySelector('.bassrow'),oct=box.querySelector('.oct'),barres=box.querySelector('.barres');barres.value=b.resolution||'';barres.onchange=()=>{b.resolution=barres.value;renderPreserveScroll()};
function refresh(){[...row.children].forEach((cell,i)=>{let n=b.bass[i]||'';cell.querySelector('.keydeg').textContent=degree(n,b.key,b.accidental);cell.querySelector('.chdeg').textContent=cint(n,b.chord)})}
box.querySelector('.copy').onclick=()=>{if(bi>0){t.bars[bi]=JSON.parse(JSON.stringify(t.bars[bi-1]));render()}};
key.onchange=()=>{b.key=key.value;refresh()};ch.oninput=()=>{b.chord=ch.value;refresh()};ch.onblur=()=>{b.chord=normalizeChord(ch.value,b.accidental);ch.value=b.chord;refresh()};oct.onchange=()=>b.octave=+oct.value||3;
box.querySelector('.spell').onclick=()=>{b.accidental=b.accidental==='sharp'?'flat':'sharp';b.chord=convertChord(ch.value,b.accidental);ch.value=b.chord;b.bass=b.bass.map(x=>convertNote(x,b.accidental));render()};
for(let i=0;i<count;i++){let cell=document.createElement('div');cell.className='note';cell.innerHTML=`<input value="${b.bass[i]||''}" placeholder="音名"><div class="deg keydeg"></div><div class="deg chdeg"></div>`;let inp=cell.querySelector('input');inp.oninput=()=>b.bass[i]=inp.value;inp.onblur=()=>{b.bass[i]=normalizeNote(inp.value,b.accidental,t.auto_low||'G2',t.auto_high||'F#3');inp.value=b.bass[i];refresh()};row.appendChild(cell)}refresh();$('bars').appendChild(box)}}
function renderPreserveScroll(){let y=window.scrollY;render();requestAnimationFrame(()=>window.scrollTo({top:y,left:0,behavior:'auto'}))}
function scrollOneBar(dir){let v=[...document.querySelectorAll('#bars .bar')];if(!v.length)return;let h=v[0].getBoundingClientRect().height+8;window.scrollBy({top:dir*h,left:0,behavior:'smooth'})}
function showFileMenu(){syncTop();$('editHeader').classList.add('hidden');$('bars').classList.add('hidden');$('fileMenu').classList.remove('hidden')}
function hideFileMenu(){$('fileMenu').classList.add('hidden');$('editHeader').classList.remove('hidden');$('bars').classList.remove('hidden');loadTop();render()}
function addBars(){for(let i=0;i<16;i++)track().bars.push(newBar());render()}
function move(d){let np=page+d;if(np<0)return;if(np*PAGE>=track().bars.length){if(d<0)return;for(let i=0;i<16;i++)track().bars.push(newBar())}page=np;render()}
function addTrack(){syncTop();let n=Math.max(0,...project.tracks.map(x=>+x.no||0))+1;project.tracks.push(newTrack(n));current=project.tracks.length-1;page=0;loadTop();render()}
function inputBars(t){for(let i=t.bars.length-1;i>=0;i--){let b=t.bars[i]||{};if(b.chord||b.chord_1_2||b.chord_3_4||(b.bass||[]).some(x=>x&&x!=='-'))return i+1}return 0}
function showConfig(){syncTop();$('editHeader').classList.add('hidden');$('bars').classList.add('hidden');$('config').classList.remove('hidden');$('trackList').innerHTML='';project.tracks.forEach(t=>{let d=document.createElement('div');d.className='trackcard';d.innerHTML=`<b>Track ${String(t.no).padStart(2,'0')}</b><input value="${(t.name||'').replace(/"/g,'&quot;')}"><span class="count">入力済 ${inputBars(t)}小節</span>`;let i=d.querySelector('input');i.oninput=()=>t.name=i.value;i.onblur=()=>{if(!i.value.trim())i.value=t.name='Track '+String(t.no).padStart(2,'0')};$('trackList').appendChild(d)})}
function hideConfig(){$('config').classList.add('hidden');$('editHeader').classList.remove('hidden');$('bars').classList.remove('hidden');loadTop();render()}
function tempSave(){syncTop();try{localStorage.setItem(TEMP,JSON.stringify(project));alert('一時保存しました')}catch(e){alert('一時保存エラー: '+e.message)}}
function tempLoad(){try{let s=localStorage.getItem(TEMP);if(!s)return alert('一時保存データがありません');project=JSON.parse(s);upgrade();current=page=0;loadTop();render();alert('一時保存を読み込みました')}catch(e){alert('一時保存読込エラー: '+e.message)}}
function safe(s){return(s||'bass_project').replace(/[\\/:*?"<>|]/g,'_')}
async function share(file,title){if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title});return true}return false}
async function saveProject(){syncTop();let n=prompt('ファイル名',safe(project.project_name));if(n===null)return;n=safe(n.replace(/\.json$/i,''));project.project_name=n;let f=new File([JSON.stringify(project,null,2)],n+'.json',{type:'application/json'});try{if(await share(f,n))return}catch(e){if(e.name==='AbortError')return}let a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=n+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function upgrade(){if(project.format!=='bass-midi-gui-multitrack'&&Array.isArray(project.bars))project={format:'bass-midi-gui-multitrack',format_version:3,version:'10',project_name:'bass_project',tracks:[{no:1,name:'Track 01',bpm:project.bpm||120,resolution:project.resolution||'8分音符',auto_low:project.auto_low||'G2',auto_high:project.auto_high||'F#3',bars:project.bars}]};project.tracks.forEach((t,i)=>{t.no=t.no||i+1;t.name=t.name||('Track '+String(t.no).padStart(2,'0'));t.auto_low=t.auto_low||'G2';t.auto_high=t.auto_high||'F#3';(t.bars||[]).forEach(ensureBar)});project.format='bass-midi-gui-multitrack';project.format_version=3;project.version='10'}
$('pick').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{project=JSON.parse(await f.text());upgrade();current=page=0;loadTop();render()}catch(err){alert('読込エラー: '+err.message)}e.target.value=''};
function vlq(n){let a=[n&127];while(n>>=7)a.unshift((n&127)|128);return a}function u32(n){return[n>>>24&255,n>>>16&255,n>>>8&255,n&255]}function ascii(s){return[...s].map(c=>c.charCodeAt(0))}
function makeMidi(t){let last=inputBars(t)-1;if(last<0)throw Error('入力されたデータがありません');let Q=480,s=sub(t),ev=[],tempo=Math.round(6e7/(t.bpm||120));ev.push({x:0,d:[255,81,3,tempo>>16&255,tempo>>8&255,tempo&255]},{x:0,d:[193,33]});for(let b=0;b<=last;b++){let bs={'4分音符':1,'8分音符':2,'16分音符':4}[t.bars[b].resolution]||s;for(let i=0;i<4*bs;i++){let n=midiNum((t.bars[b].bass||[])[i]);if(n===null)continue;let a=Math.round((b*4+i/bs)*Q),z=Math.round(a+Q/bs*.9);ev.push({x:a,d:[145,n,92]},{x:z,d:[129,n,0]})}}ev.sort((a,b)=>a.x-b.x);let d=[],p=0;for(let e of ev){d.push(...vlq(e.x-p),...e.d);p=e.x}d.push(0,255,47,0);return new Uint8Array([...ascii('MThd'),...u32(6),0,0,0,1,1,224,...ascii('MTrk'),...u32(d.length),...d])}
async function midiOne(){syncTop();let t=track();try{let f=new File([makeMidi(t)],safe(project.project_name)+'_track'+String(t.no).padStart(2,'0')+'.mid',{type:'audio/midi'});if(!await share(f,f.name)){let a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()}}catch(e){if(e.name!=='AbortError')alert('MIDI出力エラー: '+e.message)}}
async function midiAll(){syncTop();let ts=project.tracks.filter(t=>inputBars(t)>0);if(!ts.length)return alert('入力されたデータがありません');for(let t of ts){try{let f=new File([makeMidi(t)],safe(project.project_name)+'_track'+String(t.no).padStart(2,'0')+'.mid',{type:'audio/midi'});if(!await share(f,f.name)){let a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()}}catch(e){if(e.name==='AbortError')break;alert('MIDI出力エラー: '+e.message);break}}}
$('trackNo').onchange=()=>{syncTop();current=+$('trackNo').value;page=0;loadTop();render()};$('bpm').onchange=syncTop;$('res').onchange=()=>{syncTop();render()};$('trackName').onchange=syncTop;
$('fileMenuBtn').onclick=showFileMenu;$('fileBackBtn').onclick=hideFileMenu;$('scrollUpBtn').onclick=()=>scrollOneBar(-1);$('scrollDownBtn').onclick=()=>scrollOneBar(1);$('addTrackBtn').onclick=addTrack;$('configBtn').onclick=showConfig;$('backBtn').onclick=hideConfig;$('addBarsBtn').onclick=addBars;$('tempSaveBtn').onclick=tempSave;$('tempLoadBtn').onclick=tempLoad;$('saveBtn').onclick=saveProject;$('loadBtn').onclick=()=>$('pick').click();$('midiOneBtn').onclick=midiOne;$('midiAllBtn').onclick=midiAll;$('prevBtn').onclick=()=>move(-1);$('nextBtn').onclick=()=>move(1);
loadTop();render();
</script></body></html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bass MIDI">
<title>Bass MIDI GUI iPhone v3</title>
<style>*{box-sizing:border-box}html{font-size:16px}body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;margin:0;background:#f5f5f7;color:#1d1d1f;padding-bottom:24px;-webkit-text-size-adjust:100%}.app{max-width:760px;margin:auto;padding:8px}.panel{background:#fff;border-radius:12px;padding:7px;margin-bottom:6px;box-shadow:0 1px 3px #0001}.toolbar{position:sticky;top:0;z-index:20}.top,.controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.top label,.controls label{font-size:13px;display:flex;align-items:center;gap:4px}.top input{width:62px}.button,button,select,input{font:inherit}.button,button{border:1px solid #bbb;border-radius:8px;background:#fff;padding:6px 9px;min-height:38px;font-size:14px}button:disabled{opacity:.4}.primary{font-weight:600}.message{margin-top:6px;font-size:12px;color:#555}.page-nav{display:flex;align-items:center;gap:4px}.page-info{font-size:13px;font-weight:600;min-width:104px;text-align:center}.jump{width:58px;text-align:center}.bar-card{background:#fff;border:1px solid #ddd;border-radius:10px;margin-bottom:5px;padding:5px 7px}.bar-head{display:flex;align-items:center;gap:4px;flex-wrap:wrap}.bar-no{font-size:18px;font-weight:700;min-width:48px}.bar-no span{font-size:11px;font-weight:400;margin-left:2px}.bar-head label{font-size:12px}.keySel{width:60px}.chord-area{display:flex;gap:5px;flex:1;min-width:220px;flex-wrap:wrap}.chord-part{display:flex;align-items:center;gap:3px;min-width:190px;flex:1}.chord-part span{font-size:11px;color:#666;white-space:nowrap}.chord-part select{min-width:105px;flex:1}.oct{width:48px}.split-label{white-space:nowrap}.split-label input{width:18px;height:18px;margin:0;vertical-align:middle}.bass-title{display:flex;justify-content:space-between;margin:3px 1px 2px;font-size:11px;color:#666}.bass-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}.bass-item{border:1px solid #e1e1e1;border-radius:7px;padding:1px;text-align:center;background:#fafafa;min-width:0}.pos{font-size:9px;color:#888;line-height:11px}.bass-item input{width:100%;min-width:0;border:1px solid #ccc;border-radius:5px;padding:2px 2px;text-align:center;font-size:15px;height:29px}.degree{font-size:11px;line-height:13px;min-height:13px;font-weight:500}.auto-oct{font-size:9px;line-height:11px;min-height:11px;color:#777}.auto-range{width:45px;text-align:center}.page-key{width:52px}.hidden{display:none}@media(min-width:601px){.app{padding:12px}.bar-card{padding:10px}.bass-grid{grid-template-columns:repeat(8,1fr)}}@media(max-width:380px){.app{padding:5px}.panel{padding:7px}.button,button{padding:5px 7px}.chord-area{min-width:100%}.chord-part{min-width:100%}.bar-no{min-width:42px}.bass-grid{gap:3px}}</style>
</head>
<body>
<div class="app">
<div class="panel toolbar"><div class="top"><label>BPM <input id="bpm" type="number" min="1" value="120"></label><label>小節数 <input id="bars" type="number" min="1" value="64"></label><button id="setBars">設定</button><button id="add4">＋4</button><button id="set64">64</button></div><div class="controls"><label>入力 <select id="resolution"><option>4分音符</option><option>8分音符</option><option>16分音符</select></label><label>自動音域 <input id="autoLow" class="auto-range" value="G2" maxlength="4">～<input id="autoHigh" class="auto-range" value="F#3" maxlength="4"></label><select id="pageKey" class="page-key"><option>C</option><option>C#</option><option>D</option><option>D#</option><option>E</option><option>F</option><option>F#</option><option>G</option><option>G#</option><option>A</option><option>A#</option><option>B</option></select><button id="applyPageKey">表示4小節Key一括</button><button id="repeat">先頭N小節を繰り返す</button></div><div class="controls"><button id="saveCsv">CSV保存</button><button id="loadCsv">CSV読み込み</button><button class="primary" id="makeMidi">MIDI生成</button><input id="csvFile" class="hidden" type="file" accept=".csv,text/csv"></div><div class="page-nav"><button id="prevPage">← 前</button><div class="page-info" id="pageInfo">1–4 / 64小節</div><button id="nextPage">次 →</button><label>移動 <input class="jump" id="jumpBar" type="number" min="1" value="1"></label></div><div class="message" id="message">4小節ずつ表示。Keyを選ぶとBass音の度数が自動表示されます。</div></div>
<div id="grid"></div>
</div>
<script>
const ROOTS=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const CHORD_TYPES=['','m','maj7','m7','7','m7b5','dim7','dim','aug'];
const CHORDS=[];CHORD_TYPES.forEach(t=>ROOTS.forEach(r=>CHORDS.push(r+t)));
const NOTE_TO_SEMITONE={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
const DEGREE_NAMES=['Ⅰ','♭Ⅱ','Ⅱ','♭Ⅲ','Ⅲ','Ⅳ','♯Ⅳ/♭Ⅴ','Ⅴ','♭Ⅵ','Ⅵ','♭Ⅶ','Ⅶ'];
const RES={ '4分音符':1,'8分音符':2,'16分音符':4 };
let data=Array.from({length:64},()=>blankBar());
let currentPage=0;
function blankBar(){return {key:'C',split:false,chord:'',octave:3,chord_1_2:'',octave_1_2:3,chord_3_4:'',octave_3_4:3,bass:[]}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function parseNote(s,allowNoOct=false){if(!s)return null;let m=s.trim().match(allowNoOct?/^([A-Ga-g])([#b]?)(-?\d+)?$/:/^([A-Ga-g])([#b]?)(-?\d+)$/);if(!m)return null;let p=m[1].toUpperCase()+m[2];if(NOTE_TO_SEMITONE[p]===undefined)return null;return {p,oct:m[3]===undefined?null:Number(m[3])}}
function autoMidi(s){let x=parseNote(s,true);if(!x)return null;if(x.oct!==null)return (x.oct+1)*12+NOTE_TO_SEMITONE[x.p];let lo=parseNote(document.getElementById('autoLow').value,false),hi=parseNote(document.getElementById('autoHigh').value,false);if(!lo||!hi)return null;let a=(lo.oct+1)*12+NOTE_TO_SEMITONE[lo.p],b=(hi.oct+1)*12+NOTE_TO_SEMITONE[hi.p];if(a>b)return null;let pc=NOTE_TO_SEMITONE[x.p];for(let n=a;n<=b;n++)if(n%12===pc)return n;return null}
function autoNoteText(s){let n=autoMidi(s);if(n===null)return '';return `${ROOTS[n%12]}${Math.floor(n/12)-1}`}
function degree(note,key){if(!note||note.trim()==='-')return '';let x=parseNote(note,true);if(!x)return '';return DEGREE_NAMES[(NOTE_TO_SEMITONE[x.p]-NOTE_TO_SEMITONE[key]+12)%12]}
function selectHtml(values,value,cls=''){return `<select class="${cls}" data-value="${esc(value)}">${values.map(v=>`<option value="${esc(v)}" ${v===value?'selected':''}>${v||'なし'}</option>`).join('')}</select>`}
function render(){
 const sub=RES[document.getElementById('resolution').value];
 const cells=4*sub;
 const pageSize=4;
 const page=Math.max(0,Math.min(currentPage,Math.ceil(data.length/pageSize)-1));
 currentPage=page;
 const startBar=page*pageSize;
 const endBar=Math.min(data.length,startBar+pageSize);
 let h='';
 for(let bi=startBar;bi<endBar;bi++){
  const b=data[bi];
  h+=`<section class="bar-card" data-bar="${bi}"><div class="bar-head"><div class="bar-no">${bi+1}<span>小節</span></div><label>Key ${selectHtml(ROOTS,b.key,'keySel')}</label><div class="chord-area">`;
  if(b.split){
   h+=`<div class="chord-part"><span>1–2拍</span>${selectHtml(CHORDS,b.chord_1_2,'c12')}<input class="oct oct12" type="number" min="-1" max="9" value="${b.octave_1_2}" aria-label="1-2拍コードオクターブ"></div><div class="chord-part"><span>3–4拍</span>${selectHtml(CHORDS,b.chord_3_4,'c34')}<input class="oct oct34" type="number" min="-1" max="9" value="${b.octave_3_4}" aria-label="3-4拍コードオクターブ"></div>`;
  }else{
   h+=`<div class="chord-part"><span>コード</span>${selectHtml(CHORDS,b.chord,'chordSel')}<input class="oct chordOct" type="number" min="-1" max="9" value="${b.octave}" aria-label="コードオクターブ"></div>`;
  }
  h+=`</div><label class="split-label"><input type="checkbox" class="split" ${b.split?'checked':''}> 2拍分割</label></div><div class="bass-title"><span>ベース</span><span>${document.getElementById('resolution').value}</span></div><div class="bass-grid">`;
  for(let i=0;i<cells;i++){let v=b.bass[i]??'-';h+=`<div class="bass-item"><div class="pos">${i+1}</div><input class="bass" data-i="${i}" value="${esc(v)}" inputmode="text"><div class="degree">${degree(v,b.key)}</div><div class="auto-oct">${v&&v!=='-'&&parseNote(v,true)?.oct===null?`自動:${autoNoteText(v)}`:''}</div></div>`}
  h+=`</div></section>`;
 }
 document.getElementById('grid').innerHTML=h;
 document.getElementById('bars').value=data.length;
 document.getElementById('pageInfo').textContent=`${startBar+1}–${endBar} / ${data.length}小節`;
 document.getElementById('prevPage').disabled=page===0;
 document.getElementById('nextPage').disabled=endBar>=data.length;
 document.getElementById('jumpBar').value=startBar+1;
 bindGrid();
 window.scrollTo(0,0);
}
function syncRow(row){const bi=+row.dataset.bar,b=data[bi];b.key=row.querySelector('.keySel').value;b.split=row.querySelector('.split').checked;if(b.split){b.chord_1_2=row.querySelector('.c12').value;b.chord_3_4=row.querySelector('.c34').value;b.octave_1_2=Number(row.querySelector('.oct12').value);b.octave_3_4=Number(row.querySelector('.oct34').value)}else{b.chord=row.querySelector('.chordSel').value;b.octave=Number(row.querySelector('.chordOct').value)}row.querySelectorAll('.bass').forEach((x,i)=>b.bass[i]=x.value.trim()||'-');row.querySelectorAll('.bass').forEach(x=>{x.parentElement.querySelector('.degree').textContent=degree(x.value,b.key);x.parentElement.querySelector('.auto-oct').textContent=x.value&&x.value!=='-'&&parseNote(x.value,true)?.oct===null?`自動:${autoNoteText(x.value)}`:''})}
function bindGrid(){document.querySelectorAll('.bar-card').forEach(row=>{row.querySelectorAll('select,input').forEach(el=>{const update=()=>{if(el.classList.contains('split')){syncRow(row);render()}else{syncRow(row);}};el.addEventListener('change',update);el.addEventListener('input',update);});});}
function setBars(n){n=Math.max(1,Number(n)||1);while(data.length<n)data.push(blankBar());data.length=n;render()}
function hasData(b){return (b.split?(b.chord_1_2||b.chord_3_4):(b.chord))||b.bass.some(x=>x&&x!=='-')}
function lastBar(){let n=0;data.forEach((b,i)=>{if(hasData(b))n=i+1});return n}
function noteMidi(s){if(!s||s==='-')return null;let x=parseNote(s,true);if(!x)throw Error(`不正な音名です: ${s}`);let n=autoMidi(s);if(n===null)throw Error(`自動オクターブを割り当てられません: ${s}（自動音域を確認してください）`);if(n<0||n>127)throw Error(`MIDI範囲外です: ${s}`);return n}
function chordNotes(s,o){if(!s)return [];let m=s.match(/^([A-G](?:#|b)?)(.*)$/);if(!m||NOTE_TO_SEMITONE[m[1]]===undefined)throw Error(`不正なコードです: ${s}`);const ints={'':[0,4,7],m:[0,3,7],maj7:[0,4,7,11],m7:[0,3,7,10],7:[0,4,7,10],m7b5:[0,3,6,10],dim7:[0,3,6,9],dim:[0,3,6],aug:[0,4,8]};if(!(m[2] in ints))throw Error(`未対応のコード種別です: ${s}`);let r=(o+1)*12+NOTE_TO_SEMITONE[m[1]];let ns=ints[m[2]].map(x=>r+x);if(ns.some(x=>x<0||x>127))throw Error(`コードの音域がMIDI範囲外です: ${s}`);return ns}
function u16(n){return [n&255,(n>>8)&255]}function u32(n){return [(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255]}function vlq(n){let b=[n&127];while(n>>=7)b.unshift((n&127)|128);return b}
function meta(delta,type,payload=[]){return [...vlq(delta),0xff,type,...vlq(payload.length),...payload]}
function msg(delta,status,n,v){return [...vlq(delta),status,n,v]}
function textBytes(s){return [...new TextEncoder().encode(s)]}
function track(events){let bytes=[];events.forEach(e=>bytes.push(...e));bytes.push(...[0,255,47,0]);return [77,84,114,107,...u32(bytes.length),...bytes]}
function makeMidi(){let end=lastBar();if(!end)throw Error('コードまたはベースが入力されている小節がありません。');let bpm=Number(document.getElementById('bpm').value);if(bpm<=0)throw Error('BPMは1以上にしてください。');data.slice(0,end).forEach(b=>{b.bass.forEach(noteMidi);if(b.split){if(b.chord_1_2)chordNotes(b.chord_1_2,b.octave_1_2);if(b.chord_3_4)chordNotes(b.chord_3_4,b.octave_3_4)}else if(b.chord)chordNotes(b.chord,b.octave)});const tpq=480;let tempo=Math.round(60000000/bpm);let t0=[meta(0,3,textBytes('Practice Info')),meta(0,88,[4,2,24,8]),meta(0,81,[(tempo>>>16)&255,(tempo>>>8)&255,tempo&255])];let ct=[meta(0,3,textBytes('Chords')),msg(0,192,0,0)];data.slice(0,end).forEach(b=>{let parts=b.split?[[b.chord_1_2,b.octave_1_2,2],[b.chord_3_4,b.octave_3_4,2]]:[[b.chord,b.octave,4]];parts.forEach(([c,o,beats])=>{let dur=tpq*beats;if(!c){ct.push(meta(dur,3,[]));return}let ns=chordNotes(c,o);ns.forEach((n,i)=>ct.push(msg(0,144,n,70)));ns.forEach((n,i)=>ct.push(msg(i===0?dur:0,128,n,0)))})});let bt=[meta(0,3,textBytes('Bass - Direct Input')),msg(0,192,0,32)];const sub=RES[document.getElementById('resolution').value];data.slice(0,end).forEach(b=>{let arr=b.bass.slice(0,4*sub);let dur=tpq*4/arr.length;arr.forEach(s=>{let n=noteMidi(s);if(n===null)bt.push(meta(dur,3,[]));else{bt.push(msg(0,144,n,80));bt.push(msg(dur,128,n,0))}})});let body=[77,84,104,100,...u32(6+track(t0).length+track(ct).length+track(bt).length),0,1,0,3,...u16(tpq),...track(t0),...track(ct),...track(bt)];return new Uint8Array(body)}
function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function csvText(){let rows=[['bar','key','chord_split','chord','chord_octave','chord_1_2','chord_1_2_octave','chord_3_4','chord_3_4_octave','bass_resolution','bass_position','bass_note']];const r=document.getElementById('resolution').value;data.forEach((b,bi)=>b.bass.forEach((n,i)=>rows.push([bi+1,b.key,b.split?1:0,b.chord,b.octave,b.chord_1_2,b.octave_1_2,b.chord_3_4,b.octave_3_4,r,i+1,n])));return '\ufeff'+rows.map(a=>a.map(x=>`"${String(x??'').replaceAll('"','""')}"`).join(',')).join('\r\n')}
function parseCsv(text){text=text.replace(/^\ufeff/,'');let rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(q&&text[i+1]==='"'){cell+='"';i++}else q=!q}else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x!==''))rows.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}return rows}
function loadCsv(text){let rows=parseCsv(text);let head=rows.shift();let idx={};head.forEach((x,i)=>idx[x]=i);let map=new Map(),res=rows[0]?.[idx.bass_resolution]||'4分音符';rows.forEach(r=>{let bi=Number(r[idx.bar])-1;if(!Number.isFinite(bi)||bi<0)return;if(!map.has(bi))map.set(bi,blankBar());let b=map.get(bi);b.key=ROOTS.includes(r[idx.key])?r[idx.key]:'C';b.split=r[idx.chord_split]==='1';b.chord=r[idx.chord]||'';b.octave=Number(r[idx.chord_octave])||3;b.chord_1_2=r[idx.chord_1_2]||'';b.octave_1_2=Number(r[idx.chord_1_2_octave])||3;b.chord_3_4=r[idx.chord_3_4]||'';b.octave_3_4=Number(r[idx.chord_3_4_octave])||3;let p=Number(r[idx.bass_position])-1;if(p>=0)b.bass[p]=r[idx.bass_note]||'-'});let n=Math.max(0,...map.keys())+1;data=Array.from({length:n},(_,i)=>map.get(i)||blankBar());document.getElementById('resolution').value=RES[res]?res:'4分音符';render()}
document.getElementById('setBars').onclick=()=>{setBars(document.getElementById('bars').value);currentPage=0;render()};document.getElementById('add4').onclick=()=>{setBars(data.length+4);currentPage=Math.floor((data.length-1)/4);render()};document.getElementById('set64').onclick=()=>{setBars(64);currentPage=0;render()};document.getElementById('resolution').onchange=()=>render();document.getElementById('applyPageKey').onclick=()=>{let k=document.getElementById('pageKey').value;let start=currentPage*4,end=Math.min(data.length,start+4);for(let i=start;i<end;i++)data[i].key=k;render()};document.getElementById('autoLow').addEventListener('change',()=>render());document.getElementById('autoHigh').addEventListener('change',()=>render());document.getElementById('saveCsv').onclick=()=>download(new Blob([csvText()],{type:'text/csv;charset=utf-8'}),'bass_practice.csv');document.getElementById('loadCsv').onclick=()=>document.getElementById('csvFile').click();document.getElementById('csvFile').onchange=e=>{let f=e.target.files[0];if(f){let r=new FileReader();r.onload=()=>loadCsv(r.result);r.readAsText(f,'utf-8')}e.target.value=''};document.getElementById('makeMidi').onclick=()=>{try{download(new Blob([makeMidi()],{type:'audio/midi'}),'bass_practice_direct_input.mid');document.getElementById('message').textContent=`MIDIを生成しました（${lastBar()}小節。末尾の空白小節は省略）。`}catch(e){alert(e.message)}};document.getElementById('repeat').onclick=()=>{let n=Number(prompt(`先頭何小節を繰り返しますか？\n（全体：${data.length}小節）`,'4'));if(!n||n<1||n>data.length)return;data=data.map((_,i)=>JSON.parse(JSON.stringify(data[i%n])));currentPage=0;render()};document.getElementById('prevPage').onclick=()=>{currentPage--;render()};document.getElementById('nextPage').onclick=()=>{currentPage++;render()};document.getElementById('jumpBar').onchange=()=>{let n=Math.max(1,Math.min(data.length,Number(document.getElementById('jumpBar').value)||1));currentPage=Math.floor((n-1)/4);render()};render();
</script>
</body></html>
